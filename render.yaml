services:
  - type: web
    name: clipshift
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: FILE_TTL_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://clipshift-public.vercel.app
      # Optionnel : cookies Netscape encodés en base64 (YouTube anti-bot, Instagram)
      - key: YTDLP_COOKIES_B64
        sync: false
