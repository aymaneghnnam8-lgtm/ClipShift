<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ClipShift — TikTok</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-platform-page="tiktok">
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="site-header">
      <a class="logo" href="/">
        <span class="logo__mark" aria-hidden="true">C</span>
        ClipShift
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <a class="nav__link" href="/">Accueil</a>
        <a class="nav__link" href="/youtube">YouTube</a>
        <a class="nav__link" href="/instagram">Instagram</a>
        <a class="nav__link" href="/facebook">Facebook</a>
        <a class="nav__link is-active" href="/tiktok">TikTok</a>
        <a class="nav__link" href="/#faq">FAQ</a>
      </nav>
    </header>
    <main class="hero">
      <section class="hero__copy">
        <p class="brand-mark">TikTok</p>
        <h1 class="hero__title">
          Télécharge &amp; convertis en <span>un clic</span>
        </h1>
        <p class="hero__lead">
          Colle un lien TikTok public, choisis format et qualité, puis
          télécharge.
        </p>
        <form id="convert-form" class="convert-form" novalidate>
          <div class="url-combo">
            <label class="url-field url-field--combo">
              <span class="visually-hidden">Lien TikTok</span>
              <svg class="url-field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l1.92-1.92a5 5 0 0 0-7.07-7.07L10.8 6.14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <path d="M14 11a5 5 0 0 0-7.54-.54L4.54 12.38a5 5 0 0 0 7.07 7.07l1.59-1.59" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <input
                id="video-url"
                name="url"
                type="url"
                placeholder="Collez votre lien TikTok ici…"
                autocomplete="off"
                required
              />
            </label>
            <button type="submit" class="btn btn--primary btn--combo" id="btn-convert">
              Convertir <span aria-hidden="true">→</span>
            </button>
          </div>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
        <ul class="platforms"><li>TikTok</li></ul>
        <p class="social-note">Vidéos publiques uniquement.</p>
      </section>
      <section class="hero__preview" aria-label="Aperçu TikTok">
        <div class="player">
          <p id="preview-title" class="preview-title">Aperçu TikTok</p>
          <div class="player__frame" id="player-frame">
            <div class="player__scene"></div>
            <img id="preview-thumb" class="player__thumb" alt="" hidden />
            <button type="button" class="player__play" id="player-play" aria-label="Lecture">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M8 5.5v13l11-6.5L8 5.5z" />
              </svg>
            </button>
            <div class="player__bar">
              <button type="button" id="bar-play" aria-label="Play">▶</button>
              <span id="preview-time">00:00 / 00:00</span>
              <div class="player__progress"><i></i></div>
              <button type="button" aria-label="Volume">🔊</button>
              <button type="button" aria-label="Réglages">⚙</button>
              <button type="button" aria-label="Plein écran">⛶</button>
            </div>
          </div>
          <div id="formats" class="format-pills" role="group" aria-label="Format">
            <button type="button" class="format-pill is-active" data-format="mp4">MP4</button>
            <button type="button" class="format-pill" data-format="mp3">MP3</button>
            <button type="button" class="format-pill" data-format="webm">WebM</button>
          </div>
          <div id="quality-group" class="quality-row">
            <span class="option-label">Qualité</span>
            <div class="format-pills" role="group" aria-label="Qualité">
              <button type="button" class="format-pill" data-quality="360">360p</button>
              <button type="button" class="format-pill" data-quality="480">480p</button>
              <button type="button" class="format-pill is-active" data-quality="720">720p</button>
              <button type="button" class="format-pill" data-quality="1080">1080p</button>
              <button type="button" class="format-pill" data-quality="best">Max</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <span>ClipShift</span>
      <span>TikTok</span>
    </footer>
    <script src="/js/platform-page.js" defer></script>
  </body>
</html>
